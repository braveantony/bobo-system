# kind cluster "kind" 的設定，kubectl context 是 kind-kind。
# 來源是 ~/lab/cilium/01-native-routing/kind.yaml，cluster 在 2026-08-24 用這份建立。
# 沒寫 name，所以 cluster 名稱是預設的 kind。
#
# 建立方式（kind 節點跑在 root 的 podman 底下）：
#   sudo KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config yaml/infra/kind.yaml
#
# 關掉預設 CNI 和 kube-proxy，建好後要裝 Cilium，見 cilium-values.yaml。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
networking:
  disableDefaultCNI: true
  kubeProxyMode: "none"

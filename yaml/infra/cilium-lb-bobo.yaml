# 給 bobo namespace 用的 LoadBalancer IP pool 和 L2 announcement 規則。
#
# 為什麼需要：cluster 原本的預設 pool lb-pool 發的是 192.168.9.x，
# 主機沒有這個網段的路由，連不到。這裡改用跟 kind 節點同一個網段的 10.89.0.224/28，
# 再透過 L2 announcement 讓主機用 ARP 找得到。
#
# 兩個資源都只選 bobo namespace 的 service，不影響其他服務。
# 10.89.0.240/28 已經給 dp-gateway 用，這段不能重疊。
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bobo-pool
spec:
  blocks:
  - cidr: 10.89.0.224/28
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: bobo
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: bobo-l2
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: bobo
  interfaces:
  - ^eth0$
  loadBalancerIPs: true
